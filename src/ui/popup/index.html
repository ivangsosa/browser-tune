<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="popup.css" />
    <title data-i18n="appTitle">browser-tune</title>
  </head>
  <body>
    <h1>browser-tune</h1>

    <label class="row" for="profile">
      <span data-i18n="profileLabel">Profile</span>
      <select id="profile">
        <option value="balanced" data-i18n="profileBalanced">Balanced</option>
        <option value="low-resource" data-i18n="profileLowResource">Low Resource</option>
        <option value="privacy" data-i18n="profilePrivacy">Privacy</option>
        <option value="custom" data-i18n="profileCustom">Custom</option>
      </select>
    </label>

    <label class="row">
      <input type="checkbox" id="blocking" />
      <span data-i18n="domainBlocking">Domain blocking</span>
    </label>

    <label class="row">
      <input type="checkbox" id="discard" />
      <span data-i18n="discardInactiveTabs">Discard inactive tabs</span>
    </label>

    <section id="site" class="site" hidden aria-labelledby="site-title">
      <h2 id="site-title" data-i18n="thisSite">This site</h2>
      <p id="site-host" class="host"></p>
      <div class="actions">
        <button id="exclude-blocking" type="button" data-i18n="excludeFromBlocking">Don't block this site</button>
        <button id="exclude-discard" type="button" data-i18n="neverDiscardSite">Never discard this site</button>
      </div>
      <div id="pause-controls" class="row">
        <label for="pause-minutes" class="visually-hidden" data-i18n="pauseDuration">Pause duration</label>
        <select id="pause-minutes">
          <option value="15" data-i18n="pause15">15 minutes</option>
          <option value="60" data-i18n="pause60" selected>1 hour</option>
          <option value="240" data-i18n="pause240">4 hours</option>
        </select>
        <button id="pause" type="button" data-i18n="pauseBlocking">Pause blocking here</button>
      </div>
    </section>

    <section id="pauses-box" hidden aria-labelledby="pauses-title">
      <h2 id="pauses-title" data-i18n="pausedSites">Paused sites</h2>
      <ul id="pauses-list" class="pauses"></ul>
    </section>

    <section class="discard-box" aria-labelledby="tabs-title">
      <h2 id="tabs-title" data-i18n="tabsTitle">Tabs</h2>
      <p id="discarded-count"></p>
      <button id="discard-now" type="button" data-i18n="discardNow">Discard inactive tabs now</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="warnings" class="warnings"></p>
    <div id="error-box" class="error" role="alert" hidden>
      <span id="error-text"></span>
      <button id="retry" type="button" data-i18n="retryButton">Retry</button>
    </div>

    <button id="open-options" type="button" data-i18n="optionsButton">Options</button>

    <script src="popup.js"></script>
  </body>
</html>
