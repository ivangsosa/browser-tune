name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npm run build
      - run: npm run webext:lint
      - name: Empaquetar
        run: |
          cd dist/chrome && zip -qr ../../browser-tune-chrome.zip . && cd ../..
          cd dist/firefox && zip -qr ../../browser-tune-firefox.zip . && cd ../..
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" browser-tune-chrome.zip browser-tune-firefox.zip --generate-notes
